<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Warm up the TCP+TLS connection to the image host before the first <img>
         is discovered. crossorigin because images are fetched anonymously. -->
    <link rel="preconnect" href="https://picsum.photos" crossorigin />
    <link rel="preconnect" href="https://fastly.picsum.photos" crossorigin />
    <link rel="preconnect" href="https://i.pravatar.cc" crossorigin />

    <!-- Self-hosted, same-origin font. Preload so it isn't discovered only after
         CSS parses. `crossorigin` is required even same-origin: fonts are always
         fetched in CORS mode, and the preload must match or it's re-fetched. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Devlog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
